apiVersion: apps/v1
kind: Deployment
metadata:
  name: python-devops-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: python-devops-app
  template:
    metadata:
      labels:
        app: python-devops-app
    spec:
      containers:
      - name: python-devops-app
        image: madhumitha3199/devops-python-app:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 5000